<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<!-- width=device-width so a phone lays out at its own width. Zoom stays
     enabled on purpose: the strip is legible at full width, but the fine
     lettering rewards pinching into it. -->
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Chronologie de la température moyenne de la Terre — d'après xkcd 1732</title>
<meta name="description" content="Adaptation française non officielle de « A Timeline of Earth's Average Temperature » de Randall Munroe (xkcd 1732).">

<!-- Keeps the page out of search results. Delete this one line to allow
     indexing; nothing else depends on it. -->
<meta name="robots" content="noindex, nofollow">

<meta property="og:type" content="website">
<meta property="og:title" content="Chronologie de la température moyenne de la Terre">
<meta property="og:description" content="Adaptation française non officielle de xkcd 1732, de Randall Munroe.">
<!-- No og:image, deliberately: the strip is 1600 x 29913, and a link preview
     would crop it to an unreadable sliver. A dedicated 1200 x 630 card image
     can be added here later. -->

<style>
  html { background: #fff; }
  body { margin: 0; }

  /* The strip carries its own title, subtitle, sources and credit block, so
     the page is nothing but the image.

     Full viewport width, capped at the export's native 1600 px. Past that it
     would be upscaled and the lettering would soften; below it, browsers
     downscale cleanly. The width and height attributes on the element give
     the browser the aspect ratio before the image arrives, so the page
     reserves its full height immediately and the scrollbar does not jump. */
  img {
    display: block;
    margin: 0 auto;
    width: 100%;
    max-width: 1600px;
    height: auto;
  }
</style>
</head>
<body>

<img src="timeline.png"
     width="1600" height="29913"
     alt="Chronologie de la température moyenne de la Terre depuis la dernière
          glaciation : 22 000 ans de températures reconstituées, annotées
          d'événements historiques, puis trois scénarios jusqu'en 2100.
          Adaptation française d'après xkcd 1732 de Randall Munroe.">

</body>
</html>
