# Assembles the site and publishes it to GitHub Pages.
#
# The page and the render live apart in the repository -- HTML in site/,
# the PNG in results/ -- so that the image exists in exactly one place in
# git. This job brings them together.
name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'results/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deployments race; queue instead, and do not cancel one
# that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # One language folder per site/<lang>/index.html that has a render in
      # results/<lang>/. A language with no render is left out rather than
      # published with a missing image.
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r site/. _site/
          for dir in _site/*/; do
            lang=$(basename "$dir")
            if [ -f "results/$lang/timeline.png" ]; then
              cp "results/$lang/timeline.png" "$dir/timeline.png"
              echo "published: $lang"
            else
              rm -rf "$dir"
              echo "skipped (no render): $lang"
            fi
          done

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
